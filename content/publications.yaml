- title: "ChainReactor: Automated Privilege Escalation Chain Discovery via AI Planning"
  authors: "Giulio De Pasquale, Ilya Grishchenko, Riccardo Iesari, Gabriel Pizarro, Lorenzo Cavallaro, Christopher Kruegel, Giovanni Vigna"
  journal: "33rd USENIX Security Symposium (USENIX Security 24)"
